[project]
name = "notes-mcp"
version = "0.1.0"
description = "只读的本地 Markdown 笔记 MCP Server（MCP 2026-07-28 / mcp[cli] >= 2.0）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
notes-mcp = "notes_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
