[project]
name = "notes-mcp"
dynamic = ["version"]
description = "只读的本地 Markdown 笔记 MCP Server（MCP 2026-07-28 / mcp[cli] >= 2.0）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
]

[project.scripts]
notes-mcp = "notes_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.9",
    "ruff>=0.5",
    "mypy>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "notes_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["notes_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
